services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=suanle
      - POSTGRES_PASSWORD=suanle_hk_2026_db
      - POSTGRES_DB=suanle
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suanle"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://suanle:suanle_hk_2026_db@db:5432/suanle
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.ai-pixel.online/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-4-argon}
      - LLM_FALLBACK_MODELS=${LLM_FALLBACK_MODELS:-gemini-2.5-flash}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  pgdata:
