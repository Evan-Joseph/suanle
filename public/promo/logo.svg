<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#FAF9F6"/>
  
  <!-- Kun Hexagram / Eye-brows (6 Yin Line Segments) -->
  <g fill="#2B2B2B">
    <!-- Left Column (3 bars) -->
    <rect x="248" y="248" width="216" height="74" rx="6" />
    <rect x="248" y="356" width="216" height="74" rx="6" />
    <rect x="248" y="464" width="216" height="74" rx="6" />

    <!-- Right Column (3 bars) -->
    <rect x="560" y="248" width="216" height="74" rx="6" />
    <rect x="560" y="356" width="216" height="74" rx="6" />
    <rect x="560" y="464" width="216" height="74" rx="6" />
  </g>

  <!-- Smile Curve -->
  <path d="M 264 600 C 264 776, 760 776, 760 600" 
        fill="none" 
        stroke="#2B2B2B" 
        stroke-width="64" 
        stroke-linecap="round"/>
</svg>
